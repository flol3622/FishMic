<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2140"/>
      <stop offset="1" stop-color="#06101f"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="1" stop-color="#0a6cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle -->
  <rect width="512" height="512" rx="114" fill="url(#sea)"/>
  <rect width="512" height="512" rx="114" fill="url(#shine)"/>

  <!-- The notch -->
  <path d="M146 0 H366 V44 Q366 78 332 78 H180 Q146 78 146 44 Z" fill="#000"/>

  <!-- Bubbles -->
  <circle cx="392" cy="178" r="13" fill="none" stroke="#64d2ff" stroke-opacity="0.7" stroke-width="6"/>
  <circle cx="420" cy="128" r="8" fill="none" stroke="#64d2ff" stroke-opacity="0.5" stroke-width="5"/>

  <!-- Fish, swimming right -->
  <g transform="translate(0 18)">
    <path d="M118 300 L66 244 Q58 236 62 248 L84 300 L62 352 Q58 364 66 356 Z" fill="url(#fish)"/>
    <path d="M110 300 C150 214 300 196 390 262 Q414 280 414 300 Q414 320 390 338 C300 404 150 386 110 300 Z" fill="url(#fish)"/>
    <path d="M228 236 Q262 196 304 222 Q270 228 252 248 Z" fill="#0a6cff"/>
    <path d="M236 364 Q262 392 292 380 Q266 372 252 352 Z" fill="#0a6cff"/>
    <path d="M300 250 Q284 300 300 350" fill="none" stroke="#06101f" stroke-opacity="0.25" stroke-width="7" stroke-linecap="round"/>
    <circle cx="352" cy="286" r="15" fill="#fff"/>
    <circle cx="356" cy="286" r="8" fill="#06101f"/>
  </g>
</svg>
